apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
replicas:
  - name: payment-api
    count: 2
images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.27-alpine          # promotion = changing this tag via PR
labels:
  - pairs:
      kubesage.io/env: prod
    includeTemplates: true       # pods get the env label too
